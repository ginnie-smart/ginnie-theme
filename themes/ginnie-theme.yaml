Ginnie Default:
  # Import Google Fonts
  card-mod-root: |
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@300;400;500;600;700&family=Reddit+Sans:wght@300;400;500;600;700&display=swap');
  modes:
    dark:
      primary-color: "#2BAA37"
      light-primary-color: "#2BAA37"
      background-color: "#2BAA37"
      secondary-background-color: "#2BAA37"
      state-icon-color: "#999999"
      app-header-background-color: var(--card-background-color)
      app-header-text-color: var(--primary-text-color)
      primary-font-family: '"Reddit Sans", "Noto Sans Hebrew", -apple-system, "system-ui", "Segoe UI", Roboto, sans-serif'
    light:
      primary-color: "#2BAA37"
      light-primary-color: "#2BAA37"
      background-color: "#2BAA37"
      secondary-background-color: "#2BAA37"
      state-icon-color: "#999999"
      app-header-background-color: var(--card-background-color)
      app-header-text-color: var(--primary-text-color)
      primary-font-family: '"Reddit Sans", "Noto Sans Hebrew", -apple-system, "system-ui", "Segoe UI", Roboto, sans-serif'