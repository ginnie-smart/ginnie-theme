  paper-font-body1_-_font-family: '"Reddit Sans", "Noto Sans Hebrew", -apple-system, "system-ui", "Segoe UI", Roboto, sans-serif'
  paper-font-subhead_-_font-family: '"Reddit Sans", "Noto Sans Hebrew", -apple-system, "system-ui", "Segoe UI", Roboto, sans-serif'
